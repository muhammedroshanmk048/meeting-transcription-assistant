# Render Blueprint: New > Blueprint > pick this repo. Free plan, no credit card.
services:
  - type: web
    name: meetscribe
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false   # Render asks for the value when you create the Blueprint
      - key: GOOGLE_API_KEY
        sync: false
      - key: TRANSCRIBE_PROVIDER
        value: groq
      - key: LLM_PROVIDER
        value: gemini
